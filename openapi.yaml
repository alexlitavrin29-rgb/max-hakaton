    "/api/action": {
      "post": {
        "summary": "Action",
        "operationId": "action_api_action_post",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/Action"
              }
            }
          },
          "required": true
        },
        "responses": {
          "200": {
            "description": "Successful Response",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/View"
                }
              }
            }
          },
          "422": {
            "description": "Validation Error",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HTTPValidationError"
                }
              }
            }
          },
          "400": {
            "description": "Нужно ровно одно действие и выбранный раздел",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "401": {
            "description": "Сеанс завершён",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "409": {
            "description": "Устаревшая кнопка или тот же Idempotency-Key с другим действием",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "429": {
            "description": "Действие уже идёт или интервал меньше 0,4 с",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "503": {
            "description": "Очередь, тайм-аут или ошибка обработки",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "403": {
            "description": "Чужой Origin",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "413": {
            "description": "Тело больше 24000 байт",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        },
        "security": [
          {
            "MaxSession": []
          }
        ],
        "description": "Ровно одно: section, непустой text или payload из последнего ответа. Минимум 0,4 с между вызовами. Очередь до 5 с, обработка до 120 с. Ошибка внешнего источника может возвращаться как уведомление внутри HTTP 200."
      }
    }
  },
  "components": {
    "schemas": {
      "Action": {
        "properties": {
          "section": {
            "anyOf": [
              {
                "type": "string",
                "enum": [
                  "home",
                  "work",
                  "rental",
                  "help"
                ]
              },
              {
                "type": "null"
              }
            ],
            "title": "Section"
          },
          "text": {
            "type": "string",
            "maxLength": 2500,
            "title": "Text",
            "default": ""
          },
          "payload": {
            "anyOf": [
              {
                "type": "string",
                "maxLength": 200
              },
              {
                "type": "null"
              }
            ],
            "title": "Payload"
          }
        },
        "type": "object",
        "title": "Action"
      },
      "FavoriteAction": {
        "properties": {
          "card_id": {
            "type": "string",
            "pattern": "^[a-f0-9]{64}$",
            "title": "Card Id"
          },
          "saved": {
            "type": "boolean",
            "title": "Saved"
          }
        },
        "type": "object",
        "required": [
          "card_id",
          "saved"
        ],
        "title": "FavoriteAction"
      },
      "HTTPValidationError": {
        "properties": {
          "detail": {
            "items": {
              "$ref": "#/components/schemas/ValidationError"
            },
            "type": "array",
            "title": "Detail"
          }
        },
        "type": "object",
        "title": "HTTPValidationError"
      },
      "Launch": {
        "properties": {
          "init_data": {
            "type": "string",
            "maxLength": 16000,
            "title": "Init Data",
            "default": ""
          }
        },
        "type": "object",
        "title": "Launch"
      },
      "MaterialAction": {
        "properties": {
          "node_id": {
            "type": "string",
            "pattern": "^[A-Za-z][A-Za-z0-9_-]{0,79}$",
            "title": "Node Id"
          },
          "save": {
            "type": "boolean",
            "title": "Save",
            "default": false
          }
        },
        "type": "object",
        "required": [
          "node_id"
        ],
        "title": "MaterialAction"
      },
      "ValidationError": {
        "properties": {
          "loc": {
            "items": {
              "anyOf": [
                {
                  "type": "string"
                },
                {
                  "type": "integer"
                }
              ]
            },
            "type": "array",
            "title": "Location"
          },
          "msg": {
            "type": "string",
            "title": "Message"
          },
          "type": {
            "type": "string",
            "title": "Error Type"
          },
          "input": {
            "title": "Input"
