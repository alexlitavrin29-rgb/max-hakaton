{
  "openapi": "3.1.0",
  "info": {
    "title": "Точка опоры — API мини-приложения и каталога помощи",
    "version": "submission-2026-09-28",
    "description": "Публичный каталог помощи и отдельные сеансы MAX. Редактор не входит в публичный API. Тексты и доступность услуг требуют уточнения у организации. Источники вакансий и жилья могут быть недоступны."
  },
  "paths": {
    "/api/help/search": {
      "get": {
        "summary": "Search",
        "operationId": "search_api_help_search_get",
        "parameters": [
          {
            "name": "place",
            "in": "query",
            "required": true,
            "schema": {
              "type": "string",
              "minLength": 1,
              "maxLength": 150,
              "title": "Place"
            }
          },
          {
            "name": "region",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "maxLength": 150,
              "default": "",
              "title": "Region"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Successful Response",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": [
                    "choices",
                    "total"
                  ],
                  "properties": {
                    "choices": {
                      "type": "array",
                      "items": {
                        "$ref": "#/components/schemas/Place"
                      }
                    },
                    "total": {
                      "type": "integer"
                    }
                  }
                }
              }
            }
          },
          "422": {
            "description": "Validation Error",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HTTPValidationError"
                }
              }
            }
          }
        },
        "security": []
      }
    },
    "/api/help/summary": {
      "get": {
        "summary": "Summary",
        "operationId": "summary_api_help_summary_get",
        "parameters": [
          {
            "name": "place",
