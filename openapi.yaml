                  "required": [
                    "place",
                    "city_total",
                    "region_total",
                    "categories"
                  ],
                  "properties": {
                    "place": {
                      "$ref": "#/components/schemas/Place"
                    },
                    "city_total": {
                      "type": "integer"
                    },
                    "region_total": {
                      "type": "integer"
                    },
                    "categories": {
                      "type": "array",
                      "items": {
                        "type": "object"
                      }
                    }
