name: tochka
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: ../../.env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER:-support_router}" -d "$${POSTGRES_DB:-support_router}"']
      interval: 10s
      timeout: 5s
      retries: 10
  admin:
    build:
      context: ../..
      dockerfile: project/admin/Dockerfile.editor
    restart: unless-stopped
    env_file: ../../.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: '5432'
      ADMIN_PUBLIC_ORIGIN: https://admin.135-106-229-210.sslip.io
      HELP_CITY_FIRST: '1'
      HELP_API_URL: http://miniapp:8766/api/help
    depends_on:
      postgres:
        condition: service_healthy
  miniapp:
    build:
      context: ../..
      dockerfile: project/miniapp/Dockerfile
    restart: unless-stopped
    env_file: ../../.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: '5432'
      MINIAPP_PREVIEW: '0'
      MINIAPP_ORIGIN: https://135-106-229-210.sslip.io
      MINIAPP_BOT_NAME: t143_hakaton_max_bot
      HELP_CITY_FIRST: '1'
      HELP_API_URL: http://127.0.0.1:8766/api/help
      REEF_CACHE_PATH: /app/project/cache/reefapi.json
      TRUDVSEM_CACHE_PATH: /app/project/cache/trudvsem.json
      TRUDVSEM_FRESH_TTL: '60'
    volumes:
      - miniapp_cache:/app/project/cache
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8766/api/health')"]
      interval: 20s
      timeout: 5s
      retries: 3
  bot:
    build:
      context: ../..
      dockerfile: project/llm/Dockerfile.prototype
    restart: unless-stopped
    env_file: ../../.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: '5432'
      HELP_CITY_FIRST: '1'
      HELP_API_URL: http://miniapp:8766/api/help
      REEF_CACHE_PATH: /app/project/cache/reefapi.json
      TRUDVSEM_CACHE_PATH: /app/project/cache/trudvsem.json
      TRUDVSEM_FRESH_TTL: '60'
    volumes:
      - cache:/app/project/cache
    depends_on:
      miniapp:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import json,time; from pathlib import Path; d=json.loads(Path('/app/project/logs/bot-health.json').read_text()); assert time.time()-d['updated_at'] < 60 and time.time()-d.get('last_poll',0) < 120"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ['80:80', '443:443']
    env_file: ../../.deploy-secrets.env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on: [miniapp, admin]
volumes:
  pgdata:
  cache:
  miniapp_cache:
  caddydata:
  caddyconfig:
