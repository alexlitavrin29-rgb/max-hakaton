services:
  miniapp_second:
    image: tochka-submission:2026-09-28
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: '5432'
      POSTGRES_USER: support_router
      POSTGRES_DB: support_router
      MINIAPP_PREVIEW: '0'
      MINIAPP_ORIGIN: https://local.example
      HELP_CITY_FIRST: '1'
      HELP_API_URL: http://127.0.0.1:8766/api/help
    ports: ['127.0.0.1:18867:8766']
    depends_on:
      postgres: {condition: service_healthy}
